<style>
:root{
    --main-background: #070707;
    --btn-accent: #CBD868;
    --btn-hover: #A4A25C;
    --btn-active: #8C7F6F;
}

html, body{
    margin:0;
    height:100%;
    font-family: Inter, Arial, sans-serif;
    background: var(--main-background);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    user-select: none;    
}

button, input {
    -webkit-tap-highlight-color: transparent;
}

button:focus, button:active, input:focus {
    outline: none;
}

.popup{
    display: none;
    flex-direction: column;
    align-items: stretch;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: calc(100% - 32px);
    max-width: 340px;
    background: #1a1a1c;
    border-radius: 10px;
    border: none;
    padding: 22px 18px;
    box-shadow: 0 0 0 0.9px #7C874F;
    box-sizing: border-box;
    overflow: hidden;
    word-wrap: break-word;
    z-index: 1000;
}

.popup-header {
    display: flex;
    align-items: center;
    margin-top: -10px;
    margin-bottom: 20px;
    width: 100%;
}

.popup h3{
    margin: 0;
    margin-top: -0.8px;
    margin-bottom: 4px;
    color: #CBD868;
    font-size: 17px;
    font-weight: 600;
    flex-grow: 1;
    text-align: center;
}

.settings-icon-btn {
    margin-top: 0px;
    margin-left: -7px;
    margin-right: 5px;
    margin-bottom: 4px;
    background: none;
    border: none;
    color: #CBD868;
    cursor: pointer;
    border-radius: 6px;
    flex-shrink: 0;
    transition: background 0.15s;
    outline: none;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.settings-icon-btn:hover {
    background: rgba(203, 216, 104, 0.1);
}

.settings-icon-btn svg {
    width: 16.6px;
    height: 16.6px;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}

.close-settings-icon-btn {
    background: none;
    border: none;
    color: #CBD868;
    cursor: pointer;
    border-radius: 6px;
    width: 34px;
    height: 34px;

    margin-top: -10px;

.close-settings-icon-btn:hover {
    background: rgba(203, 216, 104, 0.1);
}

.close-settings-icon-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.checkbox-row {
    -webkit-tap-highlight-color: transparent;
    appearance: none;
    margin: 8px 0 0px 2px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    color: #DADADA;
    font-size: 14px;
    text-align: left;
    min-height: 22px;
    box-sizing: border-box;
    width: 100%;
}

.checkbox-row label {
    color: #DADADA;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 11px;
    user-select: none;
    text-align: left;
}

.checkbox-row label input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background-color: #262822; 
    border: 1.5px solid #555b35;
    border-radius: 4px;

    outline: none;

}

.checkbox-row label input[type="checkbox"]::after {
    content: "";

    height: 8px;
    border: solid #555;
    border-width: 0 2px 2px 0;
    transform: rotate(40deg) scale(0);

.checkbox-row label input[type="checkbox"]:checked {

<script>
const DB_NAME = "LDR_DB";
const STORE_NAME = "apps";

function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = function(e) {
            e.target.result.createObjectStore(STORE_NAME);
        };
        request.onsuccess = function(e) { resolve(e.target.result); };
        request.onerror = function() { reject("IndexedDB error"); };
    });
}

async function saveApp(htmlContent, fileName = "app.html"){
    const db = await openDB();
    return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.put(htmlContent, "userApp");
        store.put(fileName, "userAppName");
        tx.oncomplete = () => resolve();
    });
}

async function getSavedApp(){
    const db = await openDB();
    return new Promise(resolve => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const reqApp = store.get("userApp");
        const reqName = store.get("userAppName");
        
        let result = {};
        reqApp.onsuccess = () => {
            result.content = reqApp.result;
            if (result.content !== undefined && result.name !== undefined) resolve(result);
        };
        reqName.onsuccess = () => {
            result.name = reqName.result;
            if (result.content !== undefined && result.name !== undefined) resolve(result);
        };
        setTimeout(() => resolve(null), 350);
    });
}

async function saveSetting(key, value){
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);
    store.put(value, key);
}

async function getSetting(key){
    const db = await openDB();
    return new Promise(resolve => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => resolve(undefined);
    });
}

async function initPreferences() {
    const clearCheckbox = document.getElementById("clearDataCheckbox");
    const savedState = await getSetting("clearCachePreference");
    clearCheckbox.checked = (savedState === undefined || savedState === null) ? false : savedState;

    clearCheckbox.addEventListener("change", function() {
        saveSetting("clearCachePreference", clearCheckbox.checked);
    });
}

const mainPopup = document.getElementById("mainPopup");
const settingsPopup = document.getElementById("settingsPopup");
const configTextArea = document.getElementById("configTextArea");

document.getElementById("openSettingsBtn").addEventListener("click", () => {
    mainPopup.style.display = "none";
    if (window.AndroidBridgeSaver && typeof window.AndroidBridgeSaver.loadConfigFileRaw === 'function') {
        configTextArea.value = window.AndroidBridgeSaver.loadConfigFileRaw();
    } else {
        configTextArea.value = "// Bridge nije dostupan";
    }
    settingsPopup.style.display = "flex";
});

document.getElementById("closeSettingsBtn").addEventListener("click", () => {
    settingsPopup.style.display = "none";
    mainPopup.style.display = "flex";
});

document.getElementById("saveConfigBtn").addEventListener("click", () => {
    if (window.AndroidBridgeSaver && typeof window.AndroidBridgeSaver.saveConfigFile === 'function') {
        window.AndroidBridgeSaver.saveConfigFile(configTextArea.value);
        window.AndroidBridgeSaver.restartApp();
    } else {
        alert("Bridge nije dostupan!");
    }
});

                settingsPopup.style.display = "none";
                popup.style.display = "flex";
            } else {
                tapTimeout = setTimeout(() => { tapCount = 0; }, 350);
            }
        }, { capture: true, passive: true });

        shadow.getElementById("injectedCancelBtn").addEventListener("click", function() {
            popup.style.display = "none";
        });

        shadow.getElementById("injectedLoadBtn").addEventListener("click", function() {
            let fileInput = document.createElement("input");
            fileInput.type = "file";
            fileInput.accept = ".html,.htm";
            fileInput.style.display = "none";
            document.body.appendChild(fileInput);

            fileInput.addEventListener("change", async function(event) {
                const file = event.target.files[0];
                if (file) {
                    const fileName = file.name ? file.name.toLowerCase() : "";
                    if (file.type === "text/html" || file.type === "" || fileName.endsWith(".html") || fileName.endsWith(".htm")) {
                        const reader = new FileReader();
                        reader.onload = async function(e2) {
                            const htmlContent = e2.target.result;

                            if (clearCheckbox.checked) {
                                try {
                                    localStorage.clear();
                                    sessionStorage.clear();
                                    if ('caches' in window) {
                                        const cacheNames = await caches.keys();
                                        for (const name of cacheNames) { await caches.delete(name); }
                                    }
                                } catch(err) {}
                            }

                            const reqDB = indexedDB.open(DB_NAME, 1);
                            reqDB.onsuccess = function(e3) {
                                const db = e3.target.result;
                                const tx = db.transaction(STORE_NAME, "readwrite");
                                const store = tx.objectStore(STORE_NAME);
                                store.put(htmlContent, "userApp");
                                store.put(fileName, "userAppName");
                                tx.oncomplete = function() { location.reload(); };
                            };
                        };
                        reader.readAsText(file);
                    }
                }
            });
            fileInput.click();
        });
    })();
    <\/script>
    `;

    let modifiedHtml = htmlContent;
    const bodyRegex = /<\/body>/i;
    if (bodyRegex.test(modifiedHtml)) {
        modifiedHtml = modifiedHtml.replace(bodyRegex, customPopupScript + "</body>");
    } else {
        modifiedHtml += customPopupScript;
    }

    document.open();
    document.write(modifiedHtml);
    document.close();
}

});

document.getElementById("fileInput").addEventListener("change", function(event){

    if(file){
        const reader = new FileReader();
        reader.onload = async function(e) {
            const htmlContent = e.target.result;
            const clearCheckbox = document.getElementById("clearDataCheckbox");
            if (clearCheckbox && clearCheckbox.checked) {
                try {
                    localStorage.clear();
                    sessionStorage.clear();
                } catch(err) {}
            }
            await saveApp(htmlContent, file.name);
            loadApp(htmlContent, file.name);

});
