<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Loader</title>

<!-- Učitavanje konfiguracije -->
<script src="appConfig.js"></script>

<style>
:root{
    --main-background: #070707;
    --btn-accent: #CBD868;
}

html, body{
    margin:0;
    height:100%;
    font-family: Inter, Arial, sans-serif;
    background: var(--main-background);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    user-select: none;    
}

.popup{
    display: none;
    flex-direction: column;
    align-items: stretch;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: calc(100% - 32px);
    max-width: 340px;
    background: #1a1a1c;
    border-radius: 12px;
    border: none;
    padding: 22px 18px;
    box-shadow: 0 0 0 0.9px #7C874F;
    box-sizing: border-box;
    z-index: 1000;
}

.popup-header {
    display: flex;
    align-items: center;
    margin-top: -6px;
    margin-bottom: 20px;
    width: 100%;
    position: relative;
}

.popup h3{
    margin: 0;
    color: #CBD868;
    font-size: 17px;
    font-weight: 600;
    flex-grow: 1;
    text-align: center;
}

.config-icon-btn {
    background: none;
    border: none;
    color: #CBD868;
    cursor: pointer;
    border-radius: 6px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    right: 0;
    outline: none;
}

.config-icon-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}

.checkbox-row {
    margin: 12px 0 0 4px;
    display: flex;
    align-items: center;
    color: #DADADA;
    font-size: 14px;
}

.checkbox-row label {
    color: #DADADA;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 11px;
}

.checkbox-row label input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background-color: #262822; 
    border: 1.5px solid #555b35;
    border-radius: 4px;
    cursor: pointer;
    outline: none;
    margin: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.checkbox-row label input[type="checkbox"]:checked {
    background-color: var(--btn-accent);
    border-color: var(--btn-accent);
}

.row{
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 16px;
}

.row button{
    flex: 1 1 0;
    padding: 11px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    background-color: var(--btn-accent);
    color: #555;
    outline: none;
}

.mask-text{
    color: #555;
    filter: brightness(0);
}

.hidden-file-input {
    display: none;
}
</style>
</head>
<body>

<!-- GLAVNI POPUP -->
<div class="popup" id="mainPopup">
    <div class="popup-header">
        <span style="width: 30px;"></span>
        <h3 id="popupTitle">Load Html</h3>
        <button id="openConfigBtn" class="config-icon-btn" title="Edit config">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l-.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09A1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </div>
    
    <div id="checkboxContainer" class="checkbox-row">
        <label>
            <input type="checkbox" id="clearDataCheckbox">
            <span>Clear local cache and data</span>
        </label>
    </div>
    
    <div class="row">
        <button id="loadBtn"><span class="mask-text">Load</span></button>
        <button id="exitBtn"><span class="mask-text">Close</span></button>
    </div>
    
    <input type="file" id="fileInput" class="hidden-file-input" accept=".html,.htm" />
</div>

<!-- EDITOR MODAL -->
<div class="popup" id="configModal">
    <div class="popup-header">
        <span style="width: 30px;"></span>
        <h3>Edit appConfig.js</h3>
        <span></span>
    </div>
    <textarea id="configTextArea" style="width:100%; height:180px; background:#111; color:#CBD868; border:1px solid #555b35; border-radius:8px; padding:10px; font-family:monospace; font-size:12px; box-sizing:border-box; outline:none; resize:none;"></textarea>
    <div class="row" style="margin-top:14px;">
        <button id="saveConfigBtn"><span class="mask-text">Save</span></button>
        <button id="closeConfigBtn"><span class="mask-text">Close</span></button>
    </div>
</div>

<script>
const DB_NAME = "LDR_DB";
const STORE_NAME = "apps";

function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = function(e) {
            e.target.result.createObjectStore(STORE_NAME);
        };
        request.onsuccess = function(e) { resolve(e.target.result); };
        request.onerror = function() { reject("IndexedDB error"); };
    });
}

async function saveApp(htmlContent, fileName = "app.html"){
    const db = await openDB();
    return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.put(htmlContent, "userApp");
        store.put(fileName, "userAppName");
        tx.oncomplete = () => resolve();
    });
}

async function getSavedApp(){
    const db = await openDB();
    return new Promise(resolve => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const reqApp = store.get("userApp");
        const reqName = store.get("userAppName");
        
        let result = {};
        reqApp.onsuccess = () => {
            result.content = reqApp.result;
            if (result.content !== undefined && result.name !== undefined) resolve(result);
        };
        reqName.onsuccess = () => {
            result.name = reqName.result;
            if (result.content !== undefined && result.name !== undefined) resolve(result);
        };
        setTimeout(() => resolve(null), 350);
    });
}

async function saveSetting(key, value){
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);
    store.put(value, key);
}

async function getSetting(key){
    const db = await openDB();
    return new Promise(resolve => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => resolve(undefined);
    });
}

async function initPreferences() {
    const clearCheckbox = document.getElementById("clearDataCheckbox");
    const savedState = await getSetting("clearCachePreference");
    clearCheckbox.checked = (savedState === undefined || savedState === null) ? false : savedState;

    clearCheckbox.addEventListener("change", function() {
        saveSetting("clearCachePreference", clearCheckbox.checked);
    });
}

const configModal = document.getElementById("configModal");
const mainPopup = document.getElementById("mainPopup");
const configTextArea = document.getElementById("configTextArea");

document.getElementById("openConfigBtn").addEventListener("click", () => {
    mainPopup.style.display = "none";
    if (typeof config !== 'undefined') {
        configTextArea.value = `const config = {\n` +
            `    startURL: "${config.startURL || ""}",\n` +
            `    portrait: ${config.portrait},\n` +
            `    screenOn: ${config.screenOn},\n` +
            `    allowZoom: ${config.allowZoom},\n` +
            `    forceDark: ${config.forceDark},\n` +
            `    broAgent: "${config.broAgent || ""}",\n` +
            `    external: ${JSON.stringify(config.external || [], null, 4)}\n` +
            `};`;
    } else {
        configTextArea.value = "// Nema učitane konfiguracije";
    }
    configModal.style.display = "flex";
});

document.getElementById("closeConfigBtn").addEventListener("click", () => {
    configModal.style.display = "none";
    mainPopup.style.display = "flex";
});

document.getElementById("saveConfigBtn").addEventListener("click", () => {
    if (window.AndroidBridgeSaver && typeof window.AndroidBridgeSaver.saveConfigFile === 'function') {
        window.AndroidBridgeSaver.saveConfigFile(configTextArea.value);
        window.AndroidBridgeSaver.restartApp();
    } else {
        alert("Bridge nije dostupan!");
    }
});

// Funkcija za učitavanje sačuvane aplikacije
async function loadApp(htmlContent, fileName = ""){

    <script>

        shadow.innerHTML = \`
        <style>

            .popup-header {
                display: flex;
                align-items: center;
                margin-top: -6px;

                position: relative;
            }
            .popup h3 {
                margin: 0;

                cursor: pointer;

                margin: 0;
                display: inline-flex;

                justify-content: center;
            }
            .checkbox-row label input[type="checkbox"]:checked {

            }
            .row {
                display: flex;
                gap: 12px;
                justify-content: center;
                margin-top: 16px;
            }
            .row button {
                flex: 1 1 0;
                padding: 11px;
                border-radius: 10px;
                border: none;
                cursor: pointer;

                background-color: #CBD868;
                color: #555;
                outline: none;

                filter: brightness(0);
            }
        </style>

        <div id="injectedPopup" class="popup">
            <div class="popup-header">
                <span style="width: 30px;"></span>
                <h3>Load Html</h3>
                <button id="injOpenConfigBtn" class="config-icon-btn" title="Edit config">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l-.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09A1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>

            </div>
            <div class="checkbox-row">
                <label>

            </div>

        let tapCount = 0;

                const tx = db.transaction(STORE_NAME, "readonly");
                const store = tx.objectStore(STORE_NAME);
                const req = store.get("clearCachePreference");

            if (e.touches.length > 1) { tapCount = 0; return; }
            tapCount++;
            if (tapTimeout) clearTimeout(tapTimeout);
            if (tapCount >= 6) {
                tapCount = 0;
                configModal.style.display = "none";
                popup.style.display = "flex";

                tapTimeout = setTimeout(() => { tapCount = 0; }, 350);

        shadow.getElementById("injectedCancelBtn").addEventListener("click", function() {
            popup.style.display = "none";
        });

        shadow.getElementById("injectedLoadBtn").addEventListener("click", function() {

                        const reader = new FileReader();

                                    sessionStorage.clear();

                                        const cacheNames = await caches.keys();
                                        for (const name of cacheNames) { await caches.delete(name); }
                                    }

                                const db = e3.target.result;
                                const tx = db.transaction(STORE_NAME, "readwrite");
                                const store = tx.objectStore(STORE_NAME);
                                store.put(htmlContent, "userApp");
                                store.put(fileName, "userAppName");

    if (bodyRegex.test(modifiedHtml)) {
        modifiedHtml = modifiedHtml.replace(bodyRegex, customPopupScript + "</body>");
    } else {
        modifiedHtml += customPopupScript;
    }

    document.open();
    document.write(modifiedHtml);
    document.close();
}

// Pokretanje pri startu aplikacije
getSavedApp().then(saved => {
    initPreferences();
    if(saved && saved.content){
        loadApp(saved.content, saved.name || "");
    } else {
        mainPopup.style.display = "flex";
    }
});

document.getElementById("loadBtn").addEventListener("click", function(){
    document.getElementById("fileInput").click();
});

document.getElementById("fileInput").addEventListener("change", function(event){
    const file = event.target.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = async function(e) {
            const htmlContent = e.target.result;
            const clearCheckbox = document.getElementById("clearDataCheckbox");
            if (clearCheckbox && clearCheckbox.checked) {
                try {
                    localStorage.clear();
                    sessionStorage.clear();
                } catch(err) {}
            }
            await saveApp(htmlContent, file.name);
            loadApp(htmlContent, file.name);
        };
        reader.readAsText(file);
    }
});

document.getElementById("exitBtn").addEventListener("click", function(){
    window.close();
});
</script>
</body>
</html>
